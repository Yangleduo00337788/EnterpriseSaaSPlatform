  <text x="70" y="40" text-anchor="middle" class="doc-number">图 5-1</text>
  <text x="136" y="41" class="doc-title">应用请求时序图</text>
  <text x="1372" y="41" text-anchor="end" class="doc-subtitle">架构设计说明书 / 请求链路设计</text>
  <g transform="translate(0,84)">
<text x="90" y="95" class="actor">Browser</text>
  <text x="260" y="95" class="actor">request.ts</text>
  <text x="470" y="95" class="actor">apiCrypto.ts</text>
  <text x="690" y="95" class="actor">flowcloud-admin</text>
  <text x="930" y="95" class="actor">AuthInterceptor</text>
  <text x="1150" y="95" class="actor">Service / DB</text>
  <line x1="120" y1="110" x2="120" y2="720" class="line"/>
  <line x1="310" y1="110" x2="310" y2="720" class="line"/>
  <line x1="520" y1="110" x2="520" y2="720" class="line"/>
  <line x1="760" y1="110" x2="760" y2="720" class="line"/>
  <line x1="995" y1="110" x2="995" y2="720" class="line"/>
