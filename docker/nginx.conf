# ============================================================================
# FlowX Enterprise SaaS Platform - Nginx Configuration
# ============================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 100m;
    server_tokens off;

    # --------------------------------------------------------------------------
    # Gzip Compression
    # --------------------------------------------------------------------------
    gzip  on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # --------------------------------------------------------------------------
    # Rate Limiting
    # --------------------------------------------------------------------------
    # General API rate limit: 20 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    # Login rate limit: 5 requests/second per IP
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;
    # File upload rate limit: 2 requests/second per IP
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;

    # --------------------------------------------------------------------------
    # Upstream (FlowX Backend)
    # --------------------------------------------------------------------------
    upstream flowx_backend {
        server flowx-app:8080;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # HTTP Server
    # --------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Health check endpoint for Nginx itself
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ------------------------------------------------------------------
        # Security Headers
        # ------------------------------------------------------------------
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ------------------------------------------------------------------
        # API Reverse Proxy -> FlowX Backend
        # ------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://flowx_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 16 8k;
        }

        # ------------------------------------------------------------------
        # Login API (stricter rate limiting)
        # ------------------------------------------------------------------
        location /api/auth/login {
            limit_req zone=login_limit burst=10 nodelay;

            proxy_pass http://flowx_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------------
        # File Upload API (stricter rate limiting)
        # ------------------------------------------------------------------
        location /api/file/upload {
            limit_req zone=upload_limit burst=5 nodelay;
            client_max_body_size 100m;

            proxy_pass http://flowx_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
        }

        # ------------------------------------------------------------------
        # Swagger / Knife4j API Documentation
        # ------------------------------------------------------------------
        location /doc.html {
            proxy_pass http://flowx_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /swagger-resources {
            proxy_pass http://flowx_backend;
            proxy_set_header Host $host;
        }

        location /v3/api-docs {
            proxy_pass http://flowx_backend;
            proxy_set_header Host $host;
        }

        location /webjars/ {
            proxy_pass http://flowx_backend;
        }

        # ------------------------------------------------------------------
        # WebSocket Support (future real-time features)
        # ------------------------------------------------------------------
        location /ws/ {
            proxy_pass http://flowx_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ------------------------------------------------------------------
        # Static Assets - Cache Headers
        # ------------------------------------------------------------------
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        # ------------------------------------------------------------------
        # Frontend - Vue3 SPA
        # ------------------------------------------------------------------
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # No cache for index.html
            location = /index.html {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
            }
        }

        # ------------------------------------------------------------------
        # Error Pages
        # ------------------------------------------------------------------
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # --------------------------------------------------------------------------
    # HTTPS Server (uncomment for production with SSL)
    # --------------------------------------------------------------------------
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     # HSTS
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    #
    #     # ... (same location blocks as HTTP server above)
    # }
}
