server:
  port: 8080
  servlet:
    context-path: /

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/flowx?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: flowx-consumer
      auto-offset-reset: earliest
  mail:
    host: smtp.example.com
    port: 587
    username: noreply@flowx.com
    password: changeme
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-flex:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    logic-delete-field: deleted
    logic-delete-value: 1
    logic-not-delete-value: 0

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: flowx

flowx:
  jwt:
    secret: FlowX2026SecretKeyForJWTTokenGenerationMustBe256Bits!!
    access-token-expire-hours: 24
    refresh-token-expire-days: 7
    issuer: flowx
  ai:
    default-provider: deepseek
    deepseek:
      api-key: sk-xxx
      base-url: https://api.deepseek.com/v1
      model: deepseek-chat
    openai:
      api-key: sk-xxx
      base-url: https://api.openai.com/v1
      model: gpt-4o

logging:
  level:
    com.flowx: debug
    org.flowable: info
