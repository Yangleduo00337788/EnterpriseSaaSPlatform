<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Auth Inject</title></head>
<body>
<script>
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const target = params.get('target') || '/dashboard';
  if (token) {
    localStorage.setItem('token', token);
    location.replace('http://localhost:3000' + target);
  } else {
    document.body.textContent = 'missing token';
  }
</script>
</body>
</html>
